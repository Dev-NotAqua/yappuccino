<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Yappuccino: a cappuccino whose foam is a chat bubble, three dots of yap in it. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd67d" />
      <stop offset="0.55" stop-color="#ffab4c" />
      <stop offset="1" stop-color="#ff7a3d" />
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e3d1d" />
      <stop offset="0.45" stop-color="#43230f" />
      <stop offset="1" stop-color="#2a1508" />
    </linearGradient>
    <!-- One gradient over the whole foam, so its bubbles read as one cloud. -->
    <radialGradient id="foam" gradientUnits="userSpaceOnUse" cx="100" cy="82" r="96">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#f6dfbd" />
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="60" fill="url(#tile)" />
  <rect x="8" y="8" width="240" height="240" rx="60" fill="url(#gloss)" />
  <g transform="translate(0 -6)">
    <ellipse cx="124" cy="212" rx="70" ry="8" fill="#7a2e0a" opacity="0.28" />
    <rect x="52" y="194" width="140" height="14" rx="7" fill="#2a1508" />
    <path fill="none" stroke="#3a1d0b" stroke-width="13" stroke-linecap="round" d="M170 140 C206 136 208 184 152 186" />
    <path fill="url(#cup)" d="M60 122 H176 C174 162 156 198 118 198 C80 198 62 162 60 122 Z" />
    <path fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="6" stroke-linecap="round" d="M74 142 C77 162 86 178 100 187" />
    <g fill="url(#foam)">
      <circle cx="80" cy="112" r="22" />
      <circle cx="105" cy="96" r="28" />
      <circle cx="136" cy="96" r="28" />
      <circle cx="160" cy="112" r="22" />
      <rect x="56" y="106" width="126" height="26" rx="13" />
    </g>
    <g fill="#3a1d0b">
      <circle cx="98" cy="112" r="8.5" />
      <circle cx="120" cy="112" r="8.5" />
      <circle cx="142" cy="112" r="8.5" />
    </g>
  </g>
</svg>
